name: KELAS+ Build

on:
  push:
    branches: [feature/teaching-schedule-push, perf/kplus-optimization-pass2, feat/kelasplus-landing-page]
  pull_request:
    branches: [main, master, feature/teaching-schedule-push, perf/firestore-read-optimization, perf/kplus-optimization-pass2]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check optimized backend syntax
        run: node --check server/index.firestore.js && node --check server/schedule-routes.js
      - name: Build frontend
        run: npm run build
