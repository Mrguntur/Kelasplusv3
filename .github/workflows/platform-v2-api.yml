name: KELAS+ Platform V2 API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/api/**"
      - "infra/**"
      - ".github/workflows/platform-v2-api.yml"
  push:
    branches:
      - feat/platform-v2-foundation
    paths:
      - "services/api/**"
      - "infra/**"
      - ".github/workflows/platform-v2-api.yml"

permissions:
  contents: read

jobs:
  api-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand
