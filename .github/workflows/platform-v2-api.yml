name: KELAS+ Platform V2 API CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/api/**"
      - "infra/**"
      - ".github/workflows/platform-v2-api.yml"
  push:
    branches:
      - feat/platform-v2-foundation
    paths:
      - "services/api/**"
      - "infra/**"
      - ".github/workflows/platform-v2-api.yml"

permissions:
  contents: read

jobs:
  api-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kelasplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kelasplus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db

      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kelasplus_test?schema=public

      - name: Test PostgreSQL tenant RLS policies
        run: psql "postgresql://postgres:postgres@localhost:5432/kelasplus_test" -f test/rls.integration.sql

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: API security e2e tests
        run: npm run test:e2e -- --runInBand
