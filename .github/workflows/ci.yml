name: KELAS+ CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/secure-backend-v1]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server/index.js
      - run: node --check server/smoke-test.js
      - run: node server/smoke-test.js
      - run: npm run build
