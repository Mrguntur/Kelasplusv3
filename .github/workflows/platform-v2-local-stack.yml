name: KELAS+ Platform V2 Local Docker Config

on:
  pull_request:
    paths:
      - "infra/local/**"
      - ".github/workflows/platform-v2-local-stack.yml"
  push:
    branches:
      - feat/platform-v2-foundation
      - feat/platform-v2-docker-local-stack
    paths:
      - "infra/local/**"
      - ".github/workflows/platform-v2-local-stack.yml"

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --env-file infra/local/.env.example -f infra/local/docker-compose.full.yml config --quiet
