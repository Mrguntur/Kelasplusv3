name: KELAS+ PWA build

on:
  push:
    branches:
      - main
      - feat/pwa-installable
  pull_request:
    branches:
      - main
      - perf/kplus-optimization-pass2

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public Firebase web configuration (already documented in .env.example).
      # Repository variables may override these defaults for the live YoHost setup.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyByMPF8z4eBZgLNQehIxxL7b73zecbSTt4' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'kelasplusgemi.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'kelasplusgemi' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'kelasplusgemi.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '716680584392' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:716680584392:web:9fc26f9f1d523ecdd019fd' }}
      VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend and service worker syntax
        run: node --check server/index.firestore.js && node --check server/schedule-routes.js && node --check public/firebase-messaging-sw.js
      - name: Build frontend and generate PWA icons
        run: npm run build
      - name: Validate built PWA files and icon dimensions
        run: node scripts/verify-pwa-build.mjs dist
      - name: Upload install-ready web build
        uses: actions/upload-artifact@v4
        with:
          name: kelasplus-pwa-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
